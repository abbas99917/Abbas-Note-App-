<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📝 My Notes App</h1>
    <div class="form">

        <!--  form-start -->
      <input type="text"id="title"placeholder="Enter note title">
      <textarea id="description"placeholder="Write your note..."></textarea>
      <button id="addBtn">Add Note</button>
      <input type="text"id="search"placeholder="Search notes...">
      <!--  form-end -->
    </div>

    <div id="notesContainer" class="notes-container"></div>

  </div>

<script src="index.js"></script>

</body>
</html>
